<?xml version="1.0" encoding="UTF-8"?>
<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90B8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2C5F7F;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="url(#bgGradient)"/>
  
  <!-- Title -->
  <text x="200" y="35" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="18" font-weight="bold">SOCIAL MEDIA ANALYSIS</text>
  <text x="200" y="55" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14" opacity="0.9">Information Spread Detection</text>
  
  <!-- Main network diagram -->
  <g transform="translate(200, 140)">
    <!-- Central node -->
    <circle cx="0" cy="0" r="25" fill="white" opacity="0.9" filter="url(#shadow)"/>
    <text x="0" y="5" text-anchor="middle" fill="#2C5F7F" font-family="Arial, sans-serif" font-size="12" font-weight="bold">VIRAL</text>
    
    <!-- Surrounding nodes -->
    <circle cx="-60" cy="-40" r="18" fill="white" opacity="0.8"/>
    <circle cx="60" cy="-40" r="18" fill="white" opacity="0.8"/>
    <circle cx="-80" cy="30" r="15" fill="white" opacity="0.7"/>
    <circle cx="80" cy="30" r="15" fill="white" opacity="0.7"/>
    <circle cx="-40" cy="60" r="12" fill="white" opacity="0.6"/>
    <circle cx="40" cy="60" r="12" fill="white" opacity="0.6"/>
    
    <!-- Connection lines -->
    <line x1="0" y1="0" x2="-60" y2="-40" stroke="white" stroke-width="3" opacity="0.6"/>
    <line x1="0" y1="0" x2="60" y2="-40" stroke="white" stroke-width="3" opacity="0.6"/>
    <line x1="0" y1="0" x2="-80" y2="30" stroke="white" stroke-width="2" opacity="0.5"/>
    <line x1="0" y1="0" x2="80" y2="30" stroke="white" stroke-width="2" opacity="0.5"/>
    <line x1="0" y1="0" x2="-40" y2="60" stroke="white" stroke-width="2" opacity="0.4"/>
    <line x1="0" y1="0" x2="40" y2="60" stroke="white" stroke-width="2" opacity="0.4"/>
    
    <!-- Platform icons (simplified) -->
    <text x="-60" y="-35" text-anchor="middle" fill="#2C5F7F" font-family="Arial, sans-serif" font-size="8" font-weight="bold">TW</text>
    <text x="60" y="-35" text-anchor="middle" fill="#2C5F7F" font-family="Arial, sans-serif" font-size="8" font-weight="bold">WB</text>
  </g>
  
  <!-- Divider line -->
  <line x1="50" y1="220" x2="350" y2="220" stroke="white" stroke-width="2" opacity="0.6"/>
  
  <!-- Bottom stats -->
  <g>
    <text x="100" y="245" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold">20M+ Posts Analyzed</text>
    <text x="300" y="245" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold">85% Prediction Accuracy</text>
    <text x="200" y="270" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" opacity="0.8">Multilingual NLP Pipeline with BERT</text>
  </g>
</svg>