<?xml version="1.0" encoding="UTF-8"?>
<svg width="400" height="320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90B8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2C5F7F;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="chartGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4caf50;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#4caf50;stop-opacity:0.3" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="320" fill="url(#bgGradient2)"/>
  
  <!-- Title -->
  <text x="200" y="25" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="16" font-weight="bold">Cultural Sentiment Time-Series Analysis</text>
  
  <!-- Chart background -->
  <rect x="50" y="40" width="300" height="180" fill="rgba(255,255,255,0.95)" rx="8" filter="url(#shadow)"/>
  
  <!-- Grid lines -->
  <g stroke="#e0e0e0" stroke-width="0.5">
    <line x1="50" y1="70" x2="350" y2="70"/>
    <line x1="50" y1="100" x2="350" y2="100"/>
    <line x1="50" y1="130" x2="350" y2="130"/>
    <line x1="50" y1="160" x2="350" y2="160"/>
    <line x1="50" y1="190" x2="350" y2="190"/>
    
    <line x1="70" y1="40" x2="70" y2="220"/>
    <line x1="130" y1="40" x2="130" y2="220"/>
    <line x1="190" y1="40" x2="190" y2="220"/>
    <line x1="250" y1="40" x2="250" y2="220"/>
    <line x1="310" y1="40" x2="310" y2="220"/>
  </g>
  
  <!-- US sentiment trend line -->
  <path d="M 70 180 Q 100 160 130 150 T 190 130 T 250 110 T 310 90" 
        stroke="#ff5722" stroke-width="3" fill="none" stroke-linecap="round"/>
  
  <!-- China sentiment trend line -->
  <path d="M 70 170 Q 100 175 130 165 T 190 160 T 250 155 T 310 150" 
        stroke="#2196f3" stroke-width="3" fill="none" stroke-linecap="round"/>
  
  <!-- Data points -->
  <circle cx="70" cy="180" r="4" fill="#ff5722"/>
  <circle cx="130" cy="150" r="4" fill="#ff5722"/>
  <circle cx="190" cy="130" r="4" fill="#ff5722"/>
  <circle cx="250" cy="110" r="4" fill="#ff5722"/>
  <circle cx="310" cy="90" r="4" fill="#ff5722"/>
  
  <circle cx="70" cy="170" r="4" fill="#2196f3"/>
  <circle cx="130" cy="165" r="4" fill="#2196f3"/>
  <circle cx="190" cy="160" r="4" fill="#2196f3"/>
  <circle cx="250" cy="155" r="4" fill="#2196f3"/>
  <circle cx="310" cy="150" r="4" fill="#2196f3"/>
  
  <!-- Axes -->
  <line x1="50" y1="220" x2="350" y2="220" stroke="#333" stroke-width="2"/>
  <line x1="50" y1="40" x2="50" y2="220" stroke="#333" stroke-width="2"/>
  
  <!-- Year labels -->
  <text x="70" y="235" text-anchor="middle" fill="#333" font-family="Arial, sans-serif" font-size="10">1950</text>
  <text x="130" y="235" text-anchor="middle" fill="#333" font-family="Arial, sans-serif" font-size="10">1970</text>
  <text x="190" y="235" text-anchor="middle" fill="#333" font-family="Arial, sans-serif" font-size="10">1990</text>
  <text x="250" y="235" text-anchor="middle" fill="#333" font-family="Arial, sans-serif" font-size="10">2010</text>
  <text x="310" y="235" text-anchor="middle" fill="#333" font-family="Arial, sans-serif" font-size="10">2020</text>
  
  <!-- Y-axis label -->
  <text x="30" y="130" text-anchor="middle" fill="#333" font-family="Arial, sans-serif" font-size="10" transform="rotate(-90, 30, 130)">Moral Sentiment</text>
  
  <!-- Legend -->
  <rect x="60" y="50" width="100" height="40" fill="rgba(255,255,255,0.9)" rx="4"/>
  <line x1="70" y1="65" x2="90" y2="65" stroke="#ff5722" stroke-width="3"/>
  <text x="95" y="68" fill="#333" font-family="Arial, sans-serif" font-size="10">US (Effort)</text>
  <line x1="70" y1="80" x2="90" y2="80" stroke="#2196f3" stroke-width="3"/>
  <text x="95" y="83" fill="#333" font-family="Arial, sans-serif" font-size="10">China (Effort)</text>
  
  <!-- Statistics box -->
  <rect x="250" y="50" width="90" height="50" fill="rgba(255,255,255,0.9)" rx="4"/>
  <text x="295" y="65" text-anchor="middle" fill="#333" font-family="Arial, sans-serif" font-size="10" font-weight="bold">3.5B Tokens</text>
  <text x="295" y="78" text-anchor="middle" fill="#333" font-family="Arial, sans-serif" font-size="9">70+ Years</text>
  <text x="295" y="90" text-anchor="middle" fill="#333" font-family="Arial, sans-serif" font-size="9">Word2Vec</text>
  
  <!-- Technology labels -->
  <rect x="40" y="250" width="95" height="35" fill="rgba(255,255,255,0.2)" rx="6"/>
  <text x="87.5" y="265" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10" font-weight="bold">HPC</text>
  <text x="87.5" y="278" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="9">300+ Hours</text>
  
  <rect x="152.5" y="250" width="95" height="35" fill="rgba(255,255,255,0.2)" rx="6"/>
  <text x="200" y="265" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10" font-weight="bold">ARIMA</text>
  <text x="200" y="278" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="9">Time Series</text>
  
  <rect x="265" y="250" width="95" height="35" fill="rgba(255,255,255,0.2)" rx="6"/>
  <text x="312.5" y="265" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10" font-weight="bold">Published</text>
  <text x="312.5" y="278" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="9">Nature</text>
</svg>