<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f9fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e9ecef;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="usGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1976d2;stop-opacity:0.7" />
      <stop offset="100%" style="stop-color:#42a5f5;stop-opacity:0.9" />
    </linearGradient>
    <linearGradient id="chinaGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#d32f2f;stop-opacity:0.7" />
      <stop offset="100%" style="stop-color:#f44336;stop-opacity:0.9" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGradient)"/>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2c3e50">
    Moral Attitudes Towards Effort: US vs China (1950-2020)
  </text>
  
  <!-- Chart area -->
  <rect x="80" y="60" width="640" height="320" fill="white" stroke="#dee2e6" stroke-width="1" rx="4"/>
  
  <!-- Grid lines -->
  <g stroke="#f1f3f4" stroke-width="1">
    <!-- Vertical grid lines (decades) -->
    <line x1="160" y1="60" x2="160" y2="380"/>
    <line x1="240" y1="60" x2="240" y2="380"/>
    <line x1="320" y1="60" x2="320" y2="380"/>
    <line x1="400" y1="60" x2="400" y2="380"/>
    <line x1="480" y1="60" x2="480" y2="380"/>
    <line x1="560" y1="60" x2="560" y2="380"/>
    <line x1="640" y1="60" x2="640" y2="380"/>
    
    <!-- Horizontal grid lines -->
    <line x1="80" y1="140" x2="720" y2="140"/>
    <line x1="80" y1="220" x2="720" y2="220"/>
    <line x1="80" y1="300" x2="720" y2="300"/>
  </g>
  
  <!-- Axes -->
  <line x1="80" y1="380" x2="720" y2="380" stroke="#495057" stroke-width="2"/>
  <line x1="80" y1="60" x2="80" y2="380" stroke="#495057" stroke-width="2"/>
  
  <!-- X-axis labels (years) -->
  <g font-family="Arial, sans-serif" font-size="11" fill="#6c757d" text-anchor="middle">
    <text x="80" y="400">1950</text>
    <text x="160" y="400">1960</text>
    <text x="240" y="400">1970</text>
    <text x="320" y="400">1980</text>
    <text x="400" y="400">1990</text>
    <text x="480" y="400">2000</text>
    <text x="560" y="400">2010</text>
    <text x="640" y="400">2020</text>
  </g>
  
  <!-- Y-axis labels -->
  <g font-family="Arial, sans-serif" font-size="11" fill="#6c757d" text-anchor="end">
    <text x="75" y="384">0.0</text>
    <text x="75" y="304">0.1</text>
    <text x="75" y="224">0.2</text>
    <text x="75" y="144">0.3</text>
    <text x="75" y="64">0.4</text>
  </g>
  
  <!-- Y-axis title -->
  <text x="25" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#495057" transform="rotate(-90 25 220)">
    Moral Attitude Score
  </text>
  
  <!-- US trend line (increasing moralization) -->
  <polyline points="80,320 120,310 160,295 200,285 240,270 280,260 320,245 360,235 400,220 440,210 480,195 520,185 560,175 600,165 640,150" 
            fill="none" stroke="url(#usGradient)" stroke-width="3"/>
  
  <!-- China trend line (stable then declining) -->
  <polyline points="80,180 120,175 160,170 200,172 240,174 280,176 320,175 360,180 400,185 440,190 480,200 520,210 560,220 600,235 640,250" 
            fill="none" stroke="url(#chinaGradient)" stroke-width="3"/>
  
  <!-- Data points -->
  <!-- US points -->
  <g fill="#1976d2">
    <circle cx="80" cy="320" r="3"/>
    <circle cx="160" cy="295" r="3"/>
    <circle cx="240" cy="270" r="3"/>
    <circle cx="320" cy="245" r="3"/>
    <circle cx="400" cy="220" r="3"/>
    <circle cx="480" cy="195" r="3"/>
    <circle cx="560" cy="175" r="3"/>
    <circle cx="640" cy="150" r="3"/>
  </g>
  
  <!-- China points -->
  <g fill="#d32f2f">
    <circle cx="80" cy="180" r="3"/>
    <circle cx="160" cy="170" r="3"/>
    <circle cx="240" cy="174" r="3"/>
    <circle cx="320" cy="175" r="3"/>
    <circle cx="400" cy="185" r="3"/>
    <circle cx="480" cy="200" r="3"/>
    <circle cx="560" cy="220" r="3"/>
    <circle cx="640" cy="250" r="3"/>
  </g>
  
  <!-- Legend -->
  <g transform="translate(520, 420)">
    <rect x="0" y="0" width="180" height="60" fill="white" stroke="#dee2e6" rx="4"/>
    
    <!-- US legend -->
    <line x1="10" y1="20" x2="30" y2="20" stroke="#1976d2" stroke-width="3"/>
    <circle cx="20" cy="20" r="3" fill="#1976d2"/>
    <text x="35" y="24" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      United States
    </text>
    
    <!-- China legend -->
    <line x1="10" y1="40" x2="30" y2="40" stroke="#d32f2f" stroke-width="3"/>
    <circle cx="20" cy="40" r="3" fill="#d32f2f"/>
    <text x="35" y="44" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      China
    </text>
  </g>
  
  <!-- Key findings annotations -->
  <g font-family="Arial, sans-serif" font-size="10" fill="#6c757d">
    <!-- US annotation -->
    <text x="500" y="100">↗ Increasing moralization</text>
    <text x="500" y="115">of effort since 1960s</text>
    <line x1="495" y1="110" x2="450" y2="140" stroke="#1976d2" stroke-width="1" marker-end="url(#arrow)"/>
    
    <!-- China annotation -->
    <text x="200" y="100">→ Stable effort morality</text>
    <text x="200" y="115">until economic reforms</text>
    <line x1="195" y1="120" x2="160" y2="170" stroke="#d32f2f" stroke-width="1"/>
  </g>
  
  <!-- Research method note -->
  <text x="400" y="480" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#6c757d">
    Based on Word2Vec semantic similarity analysis of historical text corpora (3.5B+ tokens)
  </text>
</svg>